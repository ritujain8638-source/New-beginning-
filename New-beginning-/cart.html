<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your cart | Food with Heath</title>
  <style>
    :root { --ink: #21312b; --muted: #6e7c74; --cream: #fffaf2; --paper: #fff; --orange: #ee7548; --line: #e9e8e2; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--cream); font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
    a { color: inherit; text-decoration: none; }
    .container { width: min(980px, calc(100% - 40px)); margin: 0 auto; }
    header { padding: 24px 0; border-bottom: 1px solid var(--line); }
    nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { font-size: 1.4rem; font-weight: 800; letter-spacing: -.04em; }
    .back-link { color: var(--orange); font-weight: 800; }
    main { padding: 55px 0 80px; }
    .eyebrow { color: var(--orange); font-size: .78rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 10px 0 34px; font-size: clamp(2.5rem, 6vw, 4.5rem); letter-spacing: -.07em; }
    .cart-list { display: grid; gap: 24px; }
    .cart-item { display: grid; grid-template-columns: minmax(260px, 390px) 1fr; gap: 28px; align-items: center; padding: 18px; border-radius: 22px; background: var(--paper); box-shadow: 0 12px 30px rgba(53, 62, 47, .08); }
    .cart-item-image { width: 100%; min-height: 270px; border-radius: 15px; background-position: center; background-size: cover; }
    .cart-item h2 { margin: 0 0 10px; font-size: 1.7rem; }
    .cart-item p { margin: 0 0 22px; color: var(--muted); }
    .price { color: var(--orange); font-size: 1.2rem; font-weight: 900; }
    .quantity-controls { display: flex; align-items: center; gap: 12px; margin-top: 24px; }
    .quantity-controls button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: var(--cream); font-size: 1.1rem; cursor: pointer; }
    .quantity-controls button:hover { border-color: var(--orange); }
    .summary { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); font-size: 1.3rem; font-weight: 900; }
    .empty { padding: 35px; border-radius: 18px; background: var(--paper); color: var(--muted); }
    @media (max-width: 650px) { .cart-item { grid-template-columns: 1fr; } .cart-item-image { min-height: 220px; } }
  </style>
</head>
<body>
  <header><nav class="container"><a class="brand" href="first.html">✦ food with heath</a><a class="back-link" href="first.html#dishes">← Continue shopping</a></nav></header>
  <main class="container">
    <div class="eyebrow">Your order</div>
    <h1>Items in your cart</h1>
    <div class="cart-list"></div>
    <div class="summary"><span>Total</span><span class="total">₹0</span></div>
  </main>
  <script>
    const images = {
      "Green goddess bowl": "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=85",
      "Garden crunch salad": "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=900&q=85",
      "Sunday pomodoro": "https://images.unsplash.com/photo-1563379926898-05f4575a45d8?auto=format&fit=crop&w=900&q=85",
      "Stacked house burger": "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=85",
      "Salted caramel cloud": "https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=900&q=85",
      "Peach basil fizz": "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=900&q=85"
    };
    const list = document.querySelector(".cart-list");
    const totalElement = document.querySelector(".total");
    let cart = JSON.parse(localStorage.getItem("foodWithHeathCart") || "[]");

    function renderCart() {
      list.replaceChildren();
      let total = 0;
      cart.forEach((item) => {
        item.image = item.image || images[item.name];
        total += item.price * item.quantity;
        const card = document.createElement("article");
        card.className = "cart-item";
        card.innerHTML = `
          <div class="cart-item-image" role="img" aria-label="${item.name}" style="background-image: url('${item.image}')"></div>
          <div>
            <h2>${item.name}</h2>
            <p>₹${item.price} each</p>
            <span class="price">₹${item.price * item.quantity}</span>
            <div class="quantity-controls">
              <button type="button" data-action="decrease" data-name="${item.name}" aria-label="Decrease ${item.name} quantity">−</button>
              <strong>${item.quantity}</strong>
              <button type="button" data-action="increase" data-name="${item.name}" aria-label="Increase ${item.name} quantity">+</button>
            </div>
          </div>`;
        list.append(card);
      });
      if (!cart.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Your cart is empty. Choose a dish to get started.";
        list.append(empty);
      }
      totalElement.textContent = `₹${total}`;
      localStorage.setItem("foodWithHeathCart", JSON.stringify(cart));
    }

    list.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const item = cart.find((entry) => entry.name === button.dataset.name);
      if (!item) return;
      item.quantity += button.dataset.action === "increase" ? 1 : -1;
      cart = cart.filter((entry) => entry.quantity > 0);
      renderCart();
    });
    renderCart();
  </script>
</body>
</html>
