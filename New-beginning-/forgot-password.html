<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password | Food with Heath</title>
  <style>
    :root { --ink: #f5f1e8; --muted: #a9b3ad; --cream: #121816; --paper: #1d2723; --orange: #ee7548; --line: #34443d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--cream); color: var(--ink); font-family: Arial, sans-serif; }
    main { width: min(100%, 440px); padding: 34px; background: var(--paper); border-radius: 18px; box-shadow: 0 16px 45px rgba(0, 0, 0, .3); }
    .eyebrow { color: var(--orange); font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0 10px; font-size: 2rem; }
    p { color: var(--muted); line-height: 1.5; }
    form { display: grid; gap: 15px; margin-top: 24px; }
    label { display: grid; gap: 7px; font-size: .85rem; font-weight: 700; }
    input { width: 100%; padding: 12px 13px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: #15201c; font: inherit; }
    input:focus { outline: 2px solid rgba(238, 117, 72, .3); border-color: var(--orange); }
    .show-password { display: flex; align-items: center; gap: 8px; font-size: .85rem; font-weight: 400; }
    .show-password input { width: auto; }
    button { padding: 13px; border: 0; border-radius: 9px; background: var(--orange); color: #fff; cursor: pointer; font: inherit; font-weight: 700; }
    .status { min-height: 24px; margin: 0; font-size: .9rem; overflow-wrap: anywhere; }
    .status a { color: var(--orange); }
    .back { display: inline-block; margin-top: 18px; color: var(--orange); font-weight: 700; text-decoration: none; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Food with Heath</div>
    <h1>Reset your password</h1>
    <p id="intro">Enter the email connected to your account. We will create a secure password-reset link.</p>
    <form id="reset-request-form">
      <label for="email">Email address
        <input id="email" name="email" type="email" autocomplete="email" required>
      </label>
      <button type="submit">Send reset link</button>
    </form>
    <form id="reset-form" hidden>
      <label for="new-password">New password
        <input id="new-password" name="password" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <label for="confirm-password">Confirm new password
        <input id="confirm-password" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <label class="show-password"><input id="show-reset-password" type="checkbox"> Show password</label>
      <button type="submit">Change password</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <a class="back" href="first.html">Back to login</a>
  </main>
  <script src="api-config.js"></script>
  <script>
    const requestForm = document.querySelector("#reset-request-form");
    const resetForm = document.querySelector("#reset-form");
    const status = document.querySelector("#status");
    const token = new URLSearchParams(window.location.search).get("token");
    const newPassword = document.querySelector("#new-password");
    const confirmPassword = document.querySelector("#confirm-password");
    const showResetPassword = document.querySelector("#show-reset-password");

    async function readResponse(response) {
      const text = await response.text();
      let result;
      try { result = text ? JSON.parse(text) : {}; } catch { result = { error: text || "Request failed." }; }
      if (!response.ok) throw new Error(result.error || "Request failed.");
      return result;
    }

    if (token) {
      requestForm.hidden = true;
      document.querySelector("#intro").textContent = "Choose a new password for your account.";
      resetForm.hidden = false;
    }
    showResetPassword.addEventListener("change", () => {
      const type = showResetPassword.checked ? "text" : "password";
      newPassword.type = type;
      confirmPassword.type = type;
    });

    requestForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Creating reset link…";
      try {
        const response = await fetch(`${window.FOOD_API_URL}/api/auth/forgot-password`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: requestForm.elements.email.value })
        });
        const result = await readResponse(response);
        status.textContent = result.message;
        if (result.resetUrl) {
          status.innerHTML += ` <a href="${result.resetUrl}">Open reset page</a>`;
        }
      } catch (error) { status.textContent = error.message; }
    });

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = resetForm.elements.password.value;
      if (password !== resetForm.elements.confirmPassword.value) {
        status.textContent = "The passwords do not match.";
        return;
      }
      status.textContent = "Changing password…";
      try {
        const response = await fetch(`${window.FOOD_API_URL}/api/auth/reset-password`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password })
        });
        const result = await readResponse(response);
        status.textContent = result.message;
        resetForm.reset();
      } catch (error) { status.textContent = error.message; }
    });
  </script>
</body>
</html>
